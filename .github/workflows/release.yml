name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: arch
            os: ubuntu-latest
            container: archlinux:base-devel
          - name: windows
            os: windows-latest
            container: ""
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Git for checkout
        if: matrix.name == 'arch'
        run: pacman -Syu --noconfirm --needed git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ---------------- Arch build ----------------

      - name: Upgrade Arch Linux
        if: matrix.name == 'arch'
        uses: arch4edu/cactus/actions/upgrade-archlinux@main

      - name: Install Arch build dependencies
        if: matrix.name == 'arch'
        run: |
          pacman -Syu --noconfirm --needed \
            cargo git gnupg jaq pacman-contrib zstd

      - name: Create unprivileged build user
        if: matrix.name == 'arch'
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Import PKGBUILD signing key
        if: matrix.name == 'arch'
        run: |
          sudo -u builder gpg --fetch-keys https://github.com/yobson1.gpg

      - name: Output stripped version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-${GITHUB_REF_NAME}}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Create source tarball
        if: matrix.name == 'arch'
        run: |
          git config --global --add safe.directory "$(pwd)"
          git archive --format=tar.gz --prefix=${{ github.event.repository.name }}-src_${{ steps.version.outputs.version }}/ \
            -o ${{ github.event.repository.name }}-src_${{ steps.version.outputs.version }}.tar.gz \
            ${{ github.ref }} -- . \
            ':(exclude).github' \
            ':(exclude)pkg/arch'

      - name: Import GPG key
        if: matrix.name == 'arch'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign tarball
        if: matrix.name == 'arch'
        run: |
          gpg --batch --yes --local-user A41EB2986F63F6C40FCF2D03ED26A71EB8EB7A34 --detach-sign --armor \
            ${{ github.event.repository.name }}-src_${{ steps.version.outputs.version }}.tar.gz

      - name: Build Arch package
        if: matrix.name == 'arch'
        run: |
          steamworks_rs_ver="$(
            jaq --from toml -r '.package[] | select(.name == "steamworks") | .version' Cargo.lock | head -n1
          )"

          if [ -z "$steamworks_rs_ver" ]; then
            echo "steamworks not found in Cargo.lock"
            exit 1
          fi

          echo "steamworks-rs version: $steamworks_rs_ver"

          cd pkg/arch

          if [[ "${{ steps.version.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          else
            echo "Version '${{ steps.version.outputs.version }}' does not match X.Y.Z, leaving pkgver/pkgrel unchanged"
          fi

          sed -i "s/^_steamworks_rs_ver=.*/_steamworks_rs_ver=${steamworks_rs_ver}/" PKGBUILD

          # The release does not exist yet, so resolve its future assets from
          # the workspace while generating checksums and building the package.
          sed -i 's#${url}/releases/download/v${pkgver}#file://'"${GITHUB_WORKSPACE}"'#' PKGBUILD

          sudo -u builder updpkgsums
          sudo -u builder makepkg --syncdeps --noconfirm

          # Keep the checksums generated from the local files, but publish a
          # PKGBUILD whose sources point at the GitHub release.
          sed -i 's#file://'"${GITHUB_WORKSPACE}"'#${url}/releases/download/v${pkgver}#' PKGBUILD

      - name: Create portable Linux archive
        if: matrix.name == 'arch'
        run: |
          archive_name="${{ github.event.repository.name }}-${{ steps.version.outputs.version }}-linux-x86_64"
          stage="dist/${archive_name}"

          install -Dm755 \
            "pkg/arch/src/${{ github.event.repository.name }}-src_${{ steps.version.outputs.version }}/target/release/${{ github.event.repository.name }}" \
            "${stage}/${{ github.event.repository.name }}"
          install -Dm755 \
            pkg/arch/src/libsteam_api.so \
            "${stage}/libsteam_api.so"
          tar -C dist -czf "dist/${archive_name}.tar.gz" "${archive_name}"

      - name: Upload PKGBUILD artifact
        if: matrix.name == 'arch'
        uses: actions/upload-artifact@v7
        with:
          name: aur-pkgbuild
          path: pkg/arch/PKGBUILD

      - name: Upload Arch release asset
        if: matrix.name == 'arch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            pkg/arch/*.pkg.tar.zst
            !pkg/arch/*-debug-*.pkg.tar.zst
            ${{ github.event.repository.name }}-src_${{ steps.version.outputs.version }}.tar.gz
            ${{ github.event.repository.name }}-src_${{ steps.version.outputs.version }}.tar.gz.asc
            dist/*-linux-x86_64.tar.gz

      # ---------------- Windows build ----------------

      - name: Setup Rust
        if: matrix.name == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: matrix.name == 'windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Windows build dependencies
        if: matrix.name == 'windows'
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install pkgconfiglite

      - name: Install dav1d
        if: matrix.name == 'windows'
        run: |
          vcpkg install dav1d:x64-windows

      - name: Build Windows executable
        if: matrix.name == 'windows'
        env:
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows\lib\pkgconfig
        run: cargo build --release --locked

      - name: Create Windows ZIP
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $archiveName = "${{ github.event.repository.name }}-${{ steps.version.outputs.version }}-windows-x86_64"
          $stage = Join-Path dist $archiveName
          $steamApi = Get-ChildItem steam_api -Recurse -Filter steam_api64.dll | Select-Object -First 1

          if (-not $steamApi) {
            throw "steam_api64.dll was not downloaded by build.rs"
          }

          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target\release\${{ github.event.repository.name }}.exe" $stage
          Copy-Item $steamApi.FullName $stage
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\dav1d.dll" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\${archiveName}.zip"

      - name: Upload Windows ZIP
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.zip

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: -v --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append checksums to release notes
        run: |
          mapfile -d '' files < <(
            find artifacts -type f \
              \( -name '*.pkg.tar.zst' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.tar.gz.asc' \) \
              -print0 | sort -z
          )

          {
            echo
            echo "<details>"
            echo "<summary><strong>Checksums</strong></summary> "
            echo

            if (( ${#files[@]} == 0 )); then
              echo "No release assets found."
            else
              for algo in b2 sha512 sha384 sha256 sha224 sha1 md5; do
                cmd="${algo}sum"

                echo "### ${algo}"
                echo

                for file in "${files[@]}"; do
                  filename="$(basename "$file")"
                  hash="$("$cmd" "$file" | awk '{print $1}')"

                  printf -- '- `%s`: `%s`\n' "$filename" "$hash"
                done

                echo
              done
            fi

            echo "</details>"
          } >> CHANGELOG.md

      - name: Copy PKGBUILD to repo
        run: |
          cp artifacts/aur-pkgbuild/PKGBUILD pkg/arch/PKGBUILD

      - name: Commit generated release files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(release): update generated files for ${{ github.ref_name }}"
          file_pattern: "pkg/arch/PKGBUILD"
          branch: master

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7
        with:
          pkgname: ${{ github.event.repository.name }}
          pkgbuild: pkg/arch/PKGBUILD
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "${{ github.ref_name }}"
          updpkgsums: false

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          make_latest: true
          draft: false
          body_path: CHANGELOG.md
          files: |
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.asc
