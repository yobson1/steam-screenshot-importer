name: Release Build (Windows)

on:
  workflow_call:
    inputs:
      version:
        description: Release version, with or without a leading v
        required: false
        type: string
      artifact-name:
        description: Name of the uploaded workflow artifact
        default: windows
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Stage WiX validation inputs
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "wix-validation-stage"
          $output = Join-Path $env:RUNNER_TEMP "wix-validation-output"

          New-Item -ItemType Directory -Force $stage, $output | Out-Null
          Copy-Item "$env:SystemRoot\System32\notepad.exe" "$stage\steam-screenshot-importer.exe"
          Copy-Item "$env:SystemRoot\System32\version.dll" "$stage\steam_api64.dll"
          Copy-Item "$env:SystemRoot\System32\version.dll" "$stage\dav1d.dll"

          "WIX_VALIDATION_STAGE=$stage" >> $env:GITHUB_ENV
          "WIX_VALIDATION_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Validate WiX installer
        shell: pwsh
        run: |
          dotnet build "wix\installer.wixproj" `
            --configuration Release `
            "-p:SourceDir=$env:WIX_VALIDATION_STAGE" `
            "-p:ProductVersion=1.0.0" `
            "-p:OutputPath=$env:WIX_VALIDATION_OUTPUT\" `
            "-p:OutputName=installer"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Windows build dependencies
        shell: pwsh
        run: vcpkg install pkgconf:x64-windows dav1d:x64-windows

      - name: Build Windows executable
        env:
          PKG_CONFIG: C:\vcpkg\installed\x64-windows\tools\pkgconf\pkgconf.exe
          PKG_CONFIG_PATH: C:\vcpkg\installed\x64-windows\lib\pkgconfig
        run: cargo build --release --locked

      - name: Stage Windows distribution
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION -replace '^v', ''
          if (-not $version) {
            $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = ($metadata.packages | Where-Object name -eq '${{ github.event.repository.name }}').version
          }

          $msiVersion = ($version -split '[-+]')[0]
          if ($msiVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$version' cannot be converted to a three-part MSI version"
          }

          $archiveName = "${{ github.event.repository.name }}-windows-x86_64"

          if ($env:REQUESTED_VERSION) {
            $archiveName = "${{ github.event.repository.name }}-$version-windows-x86_64"
          }

          $stage = Join-Path dist $archiveName
          $steamApi = Get-ChildItem steam_api -Recurse -Filter steam_api64.dll | Select-Object -First 1

          if (-not $steamApi) {
            throw "steam_api64.dll was not downloaded by build.rs"
          }

          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target\release\${{ github.event.repository.name }}.exe" $stage
          Copy-Item $steamApi.FullName $stage
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\dav1d.dll" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\${archiveName}.zip"

          "WINDOWS_ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          "WINDOWS_STAGE=$stage" >> $env:GITHUB_ENV
          "MSI_VERSION=$msiVersion" >> $env:GITHUB_ENV

      - name: Create Windows MSI
        shell: pwsh
        run: |
          $output = (Resolve-Path "dist").Path

          dotnet build "wix\installer.wixproj" `
            --configuration Release `
            --no-restore `
            "-p:SourceDir=$env:WINDOWS_STAGE" `
            "-p:ProductVersion=$env:MSI_VERSION" `
            "-p:OutputPath=$output\" `
            "-p:OutputName=$env:WINDOWS_ARCHIVE_NAME"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            dist/*.msi
            dist/*.zip
          if-no-files-found: error
