name: Release Publish

on:
  workflow_call:
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: -v --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append checksums to release notes
        run: |
          mapfile -d '' files < <(
            find artifacts -type f \
              \( -name '*.pkg.tar.zst' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.tar.gz.asc' \) \
              -print0 | sort -z
          )

          {
            echo
            echo "<details>"
            echo "<summary><strong>Checksums</strong></summary> "
            echo

            if (( ${#files[@]} == 0 )); then
              echo "No release assets found."
            else
              for algo in b2 sha512 sha384 sha256 sha224 sha1 md5; do
                cmd="${algo}sum"

                echo "### ${algo}"
                echo

                for file in "${files[@]}"; do
                  filename="$(basename "$file")"
                  hash="$("$cmd" "$file" | awk '{print $1}')"

                  printf -- '- `%s`: `%s`\n' "$filename" "$hash"
                done

                echo
              done
            fi

            echo "</details>"
          } >> CHANGELOG.md

      - name: Copy PKGBUILD to repo
        run: |
          cp artifacts/aur-pkgbuild/PKGBUILD pkg/arch/PKGBUILD

      - name: Commit generated release files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(release): update generated files for ${{ github.ref_name }}"
          file_pattern: "pkg/arch/PKGBUILD"
          branch: master

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7
        with:
          pkgname: ${{ github.event.repository.name }}
          pkgbuild: pkg/arch/PKGBUILD
          commit_username: GitHub Actions
          commit_email: github-actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "${{ github.ref_name }}"
          updpkgsums: false

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          make_latest: true
          draft: false
          body_path: CHANGELOG.md
          files: |
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.asc
